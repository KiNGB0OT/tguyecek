name: ArmanUser Messenger v0.6 APK
on:
  push:
    branches:
      - armanuser-v06-sohbet-duzeltmeleri
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('app/src/main/assets/telegram.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', page, re.S)
          assert match, 'Missing embedded JavaScript'
          assert 'senderAvatar' in match.group(1), 'Sender avatars missing'
          assert 'data-sender-name' in match.group(1), 'Sender name labels missing'
          Path('/tmp/armanuser-ui.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/armanuser-ui.js
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ArmanUser-Messenger-v06-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
