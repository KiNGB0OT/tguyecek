function openModal(type,id){state.modal={type,id};renderModal()}function closeModal(){state.modal=null;renderModal()}function getChat(id){return state.chats.find(c=>c.id===id)}function enterChat(id){let c=getChat(id);if(!c)return;c.unread=0;state.open=id;state.draft='';state.reply=null;save();render()}function performChatAction(id,type){let c=getChat(id);if(!c)return;if(type==='pin')c.pinned=!c.pinned;if(type==='archive')c.archived=!c.archived;if(type==='mute')c.muted=!c.muted;if(type==='markread')c.unread=0;save();closeModal();render();toast({pin:c.pinned?'Sohbet sabitlendi':'Sabitleme kaldırıldı',archive:c.archived?'Sohbet arşivlendi':'Arşivden çıkarıldı',mute:c.muted?'Sohbet sessize alındı':'Sohbetin sesi açıldı',markread:'Okundu işaretlendi'}[type])}function sendMessage(text,image){let c=getChat(state.open);if(!c)return;let t=(text||'').trim();if(!t&&!image)return;let msgs=state.messages[c.id];if(!msgs){msgs=[{id:'s1',from:'them',text:'Merhaba! ArmanUser Messenger nasıl görünüyor?',time:'15:21'},{id:'s2',from:'me',text:'Liquid Glass tarzı çok hoş olmuş. ✨',time:'15:22'},{id:'s3',from:'them',text:'Bir mesaja iki kez dokunarak ❤️ bırakabilir, basılı tutarak yanıtlayabilirsin.',time:'15:23'},{id:'s4',from:'them',text:'Buradaki konuşmalar örnek veridir, Telegram bağlantısı yok.',time:'15:24'}]}msgs.push({id:'m'+Date.now()+Math.random().toString(36).slice(2),from:'me',text:t,time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),reply:state.reply?.text||null,image:image||null});state.messages[c.id]=msgs;c.last=t||(image?'📷 Fotoğraf':'Mesaj');c.time='Şimdi';state.reply=null;state.draft='';save();render()}
function messageAction(action){let m=state.modal,c=state.chats.find(x=>x.id===state.open),list=state.messages[c.id]||[];if(!list.length)list=[{id:'s1',from:'them',text:'Merhaba! ArmanUser Messenger nasıl görünüyor?',time:'15:21'},{id:'s2',from:'me',text:'Liquid Glass tarzı çok hoş olmuş. ✨',time:'15:22'},{id:'s3',from:'them',text:'Bir mesaja iki kez dokunarak ❤️ bırakabilir, basılı tutarak yanıtlayabilirsin.',time:'15:23'},{id:'s4',from:'them',text:'Buradaki konuşmalar örnek veridir, Telegram bağlantısı yok.',time:'15:24'}];let msg=list.find(x=>x.id===m.id);if(!msg)return;if(action==='reply'){state.reply={text:msg.text||'Fotoğraf'};closeModal();render();document.getElementById('draft')?.focus();return}if(action==='love')msg.loved=!msg.loved;if(action==='delete')list=list.filter(x=>x.id!==m.id);if(action==='copy'){const value=msg.text||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).then(()=>toast('Metin kopyalandı')).catch(()=>toast('Kopyalama desteklenmiyor'));else{let tmp=document.createElement('textarea');tmp.value=value;document.body.append(tmp);tmp.select();try{document.execCommand('copy');toast('Metin kopyalandı')}catch(e){toast('Kopyalama desteklenmiyor')}tmp.remove()}}state.messages[c.id]=list;save();closeModal();render()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.filter='Tümü';state.search='';render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-chat]').forEach(b=>{b.onclick=()=>{if(b.dataset.suppress==='1'){b.dataset.suppress='';return}enterChat(b.dataset.chat)}});const input=document.getElementById('search');if(input)input.oninput=e=>{state.search=e.target.value;const selection=e.target.selectionStart;const sc=document.getElementById('chatlist');const old=sc?.scrollTop||0;render();let neo=document.getElementById('search');neo?.focus();neo?.setSelectionRange(selection,selection);if(document.getElementById('chatlist'))document.getElementById('chatlist').scrollTop=old};const people=document.getElementById('contacts-search');if(people)people.oninput=e=>{state.contactSearch=e.target.value;render();document.getElementById('contacts-search')?.focus()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let key=b.dataset.toggle;state.settings[key]=!state.settings[key];save();render()});let slider=document.getElementById('blur-slider');if(slider){slider.oninput=e=>{state.settings.glass=+e.target.value;document.documentElement.style.setProperty('--blur',state.settings.glass*.36+'px');document.getElementById('blur-label').textContent=state.settings.glass};slider.onchange=()=>save()};document.querySelectorAll('[data-caction]').forEach(b=>b.onclick=()=>performChatAction(state.modal.id,b.dataset.caction));document.querySelectorAll('[data-maction]').forEach(b=>b.onclick=()=>messageAction(b.dataset.maction));let form=document.getElementById('composer'),ta=document.getElementById('draft');if(ta){ta.oninput=()=>{state.draft=ta.value;ta.style.height='auto';ta.style.height=Math.min(120,Math.max(44,ta.scrollHeight))+'px'};ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(ta.value)}}}if(form)form.onsubmit=e=>{e.preventDefault();sendMessage(ta.value)};let file=document.getElementById('photo');if(file)file.onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(f.size>1000000){toast('Demo için fotoğraf 1 MB altında olmalı');return}let reader=new FileReader();reader.onload=()=>sendMessage('📷 Fotoğraf',reader.result);reader.readAsDataURL(f)};bindGesture()}
function action(name){if(name==='back'){state.open=null;state.reply=null;render()}else if(name==='new-chat'||name==='unavailable'||name==='chat-info'||name==='backup'||name==='reset')openModal(name);else if(name==='close')closeModal();else if(name==='attach')document.getElementById('photo')?.click();else if(name==='cancel-reply'){state.reply=null;render()}else if(name==='create-chat'){let name=document.getElementById('newname')?.value.trim();if(!name){toast('Sohbet adını yaz');return}let id='c'+Date.now();state.chats.unshift({id,name,last:'Yeni örnek sohbet',initial:name.charAt(0).toUpperCase(),hue:'#4a91c9',unread:0,group:false,time:'Şimdi',pinned:false,archived:false,muted:false});save();closeModal();enterChat(id)}else if(name==='backup-copy'){let v=document.getElementById('backupjson').value;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(v).then(()=>toast('JSON kopyalandı')).catch(()=>toast('Kopyalanamadı'));else{document.getElementById('backupjson').select();document.execCommand('copy');toast('JSON kopyalandı')}}else if(name==='backup-import'){let v=document.getElementById('backupjson').value;try{let d=JSON.parse(v);if(!Array.isArray(d.chats)||typeof d.settings!=='object'||typeof d.messages!=='object')throw 0;state.chats=d.chats;state.settings={...defaults,...d.settings};state.messages=d.messages;save();closeModal();render();toast('Demo verileri içe aktarıldı')}catch(e){toast('Geçerli bir demo JSON yedeği gerekli')}}else if(name==='reset-confirm'){try{localStorage.removeItem('armanuser-v03')}catch(e){}state.chats=JSON.parse(JSON.stringify(seed));state.messages={};state.settings={...defaults};state.tab='Sohbetler';state.open=null;closeModal();render();toast('Demo sıfırlandı')}}
let lastTouch={};function bindGesture(){document.querySelectorAll('[data-swipe]').forEach(row=>{let start=null,tm;row.addEventListener('touchstart',e=>{start={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};tm=setTimeout(()=>{if(start){row.dataset.suppress='1';openModal('chat-actions',row.dataset.swipe)}},700)},{passive:true});row.addEventListener('touchmove',e=>{if(start&&(Math.abs(e.touches[0].clientX-start.x)>13||Math.abs(e.touches[0].clientY-start.y)>15))clearTimeout(tm)},{passive:true});row.addEventListener('touchend',e=>{clearTimeout(tm);if(!start)return;let dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4){row.dataset.suppress='1';performChatAction(row.dataset.swipe,dx<0?'archive':'pin')}start=null},{passive:true});row.addEventListener('contextmenu',e=>{e.preventDefault();openModal('chat-actions',row.dataset.swipe)})});document.querySelectorAll('[data-message]').forEach(el=>{let timer,pt,lastTap=0;el.addEventListener('touchstart',e=>{pt={x:e.touches[0].clientX,y:e.touches[0].clientY};timer=setTimeout(()=>{openModal('message-actions',el.dataset.message);timer=null},650)},{passive:true});el.addEventListener('touchmove',e=>{if(pt&&(Math.abs(pt.x-e.touches[0].clientX)>13||Math.abs(pt.y-e.touches[0].clientY)>13))clearTimeout(timer)},{passive:true});el.addEventListener('touchend',()=>clearTimeout(timer),{passive:true});el.addEventListener('dblclick',()=>{let c=getChat(state.open),msgs=state.messages[c.id]||[];if(!msgs.length){openModal('message-actions',el.dataset.message);messageAction('love')}else{let m=msgs.find(x=>x.id===el.dataset.message);if(m){m.loved=!m.loved;save();render()}}});el.addEventListener('contextmenu',e=>{e.preventDefault();openModal('message-actions',el.dataset.message)})});const target=document.querySelector('.scroller');if(target){let start=null;target.addEventListener('touchstart',e=>{if(e.target.closest('button,input,textarea,[data-swipe]'))return;start={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});target.addEventListener('touchend',e=>{if(!start)return;let dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>105&&Math.abs(dy)<55){switchTabBy(dx<0?1:-1)}start=null},{passive:true})}}
function switchTabBy(dir){let idx=nav.indexOf(state.tab);let next=idx+dir;if(next<0||next>=nav.length)return;state.tab=nav[next];render()}
function back(){if(state.modal){closeModal();return true}if(state.open){state.open=null;state.reply=null;render();return true}if(state.tab!=='Sohbetler'){state.tab='Sohbetler';render();return true}return false}window.armanBack=back;document.addEventListener('keydown',e=>{if(e.key==='Escape')back()});render();
})();
