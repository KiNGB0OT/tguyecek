<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ArmanUser Messenger</title>
<style>
:root{color-scheme:light;--ink:#142949;--muted:#7289a6;--glass:rgba(255,255,255,.52);--edge:rgba(255,255,255,.86);--blue:#147efb;--shadow:0 16px 44px rgba(54,105,168,.18);--wall:#edf5ff}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden}body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(140deg,#d8eaff,#f9fbff 46%,#d2e6fc);-webkit-tap-highlight-color:transparent}.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.orb{position:absolute;width:270px;height:270px;border-radius:50%;filter:blur(42px);opacity:.58;background:#80b6ff;top:-120px;left:-60px}.orb.b{background:#d5ccff;right:-100px;left:auto;top:48%;width:300px}.orb.c{background:#98edf6;top:auto;bottom:-130px;left:5%;width:260px}.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.glass{background:var(--glass);backdrop-filter:blur(25px) saturate(1.6);-webkit-backdrop-filter:blur(25px) saturate(1.6);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.8)}.top{display:flex;align-items:center;justify-content:space-between;padding:19px 21px 11px;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.6px}.logo{background:linear-gradient(145deg,#119eff,#1463e9);border:1px solid #b8e3ff;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 9px 20px #398eff49}.pill{border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:11px 15px;color:var(--ink);font-weight:600;box-shadow:inset 0 1px #fff5;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.small{font-size:12px;color:var(--muted)}.view{flex:1;min-height:0;display:flex;flex-direction:column}.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:8px 16px 115px}.panel{border-radius:27px;padding:25px 20px;margin:38px 19px 0}.title{font-size:29px;font-weight:800;letter-spacing:-1px;margin:0 0 8px}.desc{color:var(--muted);line-height:1.48;font-size:14px;margin:0 0 22px}label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:15px 2px 7px}input{background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.92);outline:none;border-radius:16px;padding:15px 16px;color:var(--ink);width:100%;font-size:16px;box-shadow:inset 0 1px 4px rgba(30,65,110,.05)}input:focus{border-color:#63a4ff;box-shadow:0 0 0 3px #599cfa2b}.primary{border:0;border-radius:18px;background:linear-gradient(130deg,#1889ff,#1068ee);box-shadow:0 10px 22px #2c8eff41;color:white;font-size:16px;font-weight:700;padding:15px;width:100%;margin-top:18px}.info{font-size:12px;line-height:1.6;color:var(--muted)}a{color:#147efb}.search{margin:0 18px 12px;padding:2px 15px;display:flex;align-items:center;gap:8px;border-radius:20px}.search input{padding:11px 2px;border:0;box-shadow:none;background:transparent;font-size:14px}.section{font-size:27px;font-weight:800;letter-spacing:-.8px;padding:5px 22px 13px}.chat{display:flex;align-items:center;gap:12px;padding:13px;margin:0 0 9px;border-radius:24px}.avatar{width:47px;height:47px;flex-shrink:0;border-radius:17px;background:linear-gradient(145deg,#8bc5ff,#788bea);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:700}.content{flex:1;min-width:0}.chatname{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.time{font-size:11px;color:var(--muted)}.count{display:inline-flex;background:#1684fa;color:#fff;border-radius:14px;min-width:21px;height:21px;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:8px}.tabs{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:17px;right:17px;height:69px;border-radius:26px;display:flex;align-items:center;justify-content:space-around}.tab{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center;font-size:10px;font-weight:650;min-width:65px}.tab .sym{font-size:23px}.tab.active{color:var(--blue)}.back{border:0;background:transparent;color:var(--blue);font-size:16px;font-weight:700;padding:10px 4px}.messages{padding:8px 16px 14px;display:flex;flex-direction:column;gap:10px}.bubble{align-self:flex-start;max-width:86%;border-radius:20px 21px 20px 6px;padding:11px 13px;line-height:1.45;background:rgba(255,255,255,.74);box-shadow:0 3px 12px #36587b13;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:linear-gradient(125deg,#58b3ff,#2179f0);color:white;border-radius:20px 20px 6px 20px}.msgtime{display:block;text-align:right;font-size:10px;opacity:.65;margin-top:4px}.compose{display:flex;gap:9px;align-items:center;padding:11px 17px max(14px,env(safe-area-inset-bottom));border-top:1px solid #fff8}.compose input{flex:1;min-width:0}.send{border:0;border-radius:18px;background:var(--blue);color:#fff;padding:13px 15px;font-size:17px}.hide{display:none!important}.spinner{font-size:20px;text-align:center;padding:27px;color:var(--muted)}.note{border:1px solid #ffffffa0;background:#ffffff50;border-radius:16px;margin:10px 18px;padding:12px;color:var(--muted);font-size:12px;line-height:1.5}.toast{position:absolute;left:22px;right:22px;bottom:103px;z-index:9;border-radius:16px;padding:13px 16px;background:#173d6bea;color:white;box-shadow:0 10px 30px #10263a55}.dark{color-scheme:dark;--ink:#e7f1ff;--muted:#97a9c6;--glass:rgba(32,51,81,.54);--edge:rgba(201,230,255,.19);--shadow:0 18px 46px #020b1b70;--wall:#112038;background:linear-gradient(140deg,#0b172a,#162943 45%,#10192b)}.dark .orb{opacity:.25}.dark input{background:#1f3556a8;border-color:#6287b149}.dark .bubble{background:#344f71d9}.dark .note{background:#21375788;border-color:#7a9abd40}
</style></head><body><div class="bg"><i class="orb"></i><i class="orb b"></i><i class="orb c"></i></div><div id="app" class="app"></div>
<script>
(() => {const n=window.TelegramNative;let stage='loading', current=null, title='', items=[], messages=[], q='', tab='chats', name='', dark=localStorage.getItem('arm-dark')==='1';if(dark)document.body.classList.add('dark');const root=document.getElementById('app');let toastTimer;function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function icon(){return `<span class="logo">A</span>`;}function head(){return `<header class="top"><div class="brand">${icon()}<span>ArmanUser</span></div><button class="pill" id="theme">${dark?'☀️':'🌙'}</button></header>`;}function connectClicks(){const t=document.getElementById('theme');if(t)t.onclick=()=>{dark=!dark;localStorage.setItem('arm-dark',dark?'1':'0');document.body.classList.toggle('dark',dark);n.theme(dark);render();};}function notify(t){let old=document.getElementById('toast');if(old)old.remove();const x=document.createElement('div');x.className='toast';x.id='toast';x.textContent=t;root.append(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),4200);}
function login(){let title='',desc='',fields='',action='';if(stage==='loading'){root.innerHTML=head()+`<div class="panel glass"><div class="spinner">Telegram bağlantısı hazırlanıyor…</div></div>`;connectClicks();return;}if(stage==='api'){title='Telegram API bağlantısı';desc='Bu resmi olmayan istemci için Telegram uygulama kimliğini bir kez gir. Bilgiler yalnızca telefonunda Android Keystore ile şifrelenerek saklanır.';fields=`<label>API ID</label><input name="id" type="number" inputmode="numeric" value="20672652" required placeholder="API ID"><label>API Hash</label><input name="hash" autocapitalize="none" autocomplete="off" required placeholder="32 karakterlik API Hash">`;action='API bilgilerini kaydet';}if(stage==='phone'){title='Telefon numaran';desc='Telegram hesabının telefon numarasını uluslararası biçimde gir.';fields=`<label>Telefon numarası</label><input name="value" type="tel" inputmode="tel" required placeholder="+90 5xx xxx xx xx">`;action='Doğrulama kodu iste';}if(stage==='code'){title='Doğrulama kodu';desc='Telegram uygulamasına veya numarana gelen kodu gir. Bu kod sadece Telegram sunucularına TDLib üzerinden gönderilir.';fields=`<label>Telegram kodu</label><input name="value" inputmode="numeric" autocomplete="one-time-code" required placeholder="Doğrulama kodu">`;action='Doğrula';}if(stage==='password'){title='İki aşamalı doğrulama';desc='Telegram hesabın için belirlediğin iki aşamalı doğrulama parolasını gir.';fields=`<label>Telegram parolan</label><input name="value" type="password" required placeholder="Parola">`;action='Giriş yap';}if(stage==='email'){title='E-posta doğrulama';desc='Telegram giriş için e-posta adresi talep ediyor.';fields=`<label>E-posta</label><input name="value" type="email" required placeholder="E-posta adresi">`;action='Devam';}if(stage==='emailcode'){title='E-posta kodu';desc='Telegram tarafından gönderilen e-posta kodunu gir.';fields=`<label>E-posta kodu</label><input name="value" required placeholder="Doğrulama kodu">`;action='Doğrula';}if(stage==='register'){title='Telegram kaydı';desc='Yeni hesap oluşturmak için adını gir.';fields=`<label>Ad</label><input name="value" required placeholder="Ad"><label>Soyad (isteğe bağlı)</label><input name="extra" placeholder="Soyad">`;action='Hesap oluştur';}if(stage==='otherdevice'){title='Telegram onayı';desc='Başka bir cihazdaki Telegram uygulaman üzerinden oturum açma isteğini onayla.';action='Bekleniyor';}
root.innerHTML=head()+`<main class="view"><section class="panel glass"><div class="title">${title}</div><p class="desc">${desc}</p><form id="login">${fields}<button class="primary" type="submit" ${stage==='otherdevice'?'disabled':''}>${action}</button></form>${stage==='api'?`<p class="info" style="margin-top:20px">API ID ve API Hash almak için telefon tarayıcında <b>my.telegram.org</b> adresinden <b>API development tools</b> bölümüne gir. <strong>Bu bilgileri bu sohbet üzerinden paylaşma.</strong></p>`:''}</section><div class="note">Bu bir Telegram istemcisidir, resmi Telegram uygulaması değildir. ARMAN AI henüz bağlı değildir.</div></main>`;connectClicks();const f=document.getElementById('login');f.onsubmit=ev=>{ev.preventDefault();const d=new FormData(f);if(stage==='api'){n.saveApi(d.get('id'),d.get('hash'));}else n.submit(stage,d.get('value')||'',d.get('extra')||'');f.querySelector('button').disabled=true;setTimeout(()=>{const b=f.querySelector('button');if(b)b.disabled=false;},2500);};}
function tabs(){return `<nav class="tabs glass"><button class="tab ${tab==='chats'?'active':''}" data-tab="chats"><span class="sym">◉</span>Sohbetler</button><button class="tab ${tab==='settings'?'active':''}" data-tab="settings"><span class="sym">⚙</span>Ayarlar</button></nav>`;}
function list(){const data=items.filter(x=>x.title.toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr')));return head()+`<div class="section">${tab==='chats'?'Sohbetler':'Ayarlar'}</div>${tab==='chats'?`<div class="search glass"><span>⌕</span><input id="search" placeholder="Sohbet ara" value="${e(q)}"></div><div class="scroll" id="chatlist">${data.length?data.map(x=>`<article class="chat glass" data-id="${e(x.id)}"><div class="avatar">${e((x.title||'?')[0].toUpperCase())}</div><div class="content"><div class="chatname">${e(x.title)}</div><div class="preview">${e(x.last||'Mesaj yok')}</div></div><div style="text-align:right"><div class="time">${x.date?new Date(x.date*1000).toLocaleDateString('tr-TR',{day:'numeric',month:'short'}):''}</div>${x.unread?`<span class="count">${x.unread}</span>`:''}</div></article>`).join(''):`<div class="note">Sohbetleriniz Telegram üzerinden yükleniyor. İnternet bağlantınızı kontrol edin.</div>`}</div>`:`<div class="scroll"><section class="panel glass" style="margin-top:5px"><b>${e(name||'Telegram hesabı')}</b><p class="desc" style="margin-top:8px">ArmanUser Messenger v0.4 • Gerçek Telegram bağlantısı</p><p class="info">API bilgileri cihazda şifreli saklanır. Bu bir test sürümüdür.</p><button class="primary" id="logout" style="background:#ce4458">Telegram'dan çıkış yap</button></section></div>`}${tabs()}`;}
function conversation(){return `<div class="top glass" style="border-radius:0 0 24px 24px"><button class="back" id="back">‹ Geri</button><div style="font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(title)}</div><span style="width:50px"></span></div><div id="msgscroll" class="scroll" style="padding:8px 12px 4px"><div class="messages">${messages.length?messages.map(x=>`<div class="bubble ${x.out?'mine':''}">${e(x.text||'Mesaj')}<span class="msgtime">${x.date?new Date(x.date*1000).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):''}</span></div>`).join(''):`<div class="spinner">Mesajlar yükleniyor…</div>`}</div></div><form id="compose" class="compose glass"><input id="draft" placeholder="Mesaj yaz…" autocomplete="off"><button class="send" type="submit">➤</button></form>`;}
function render(){if(stage!=='ready'){login();return;}root.innerHTML=current?conversation():list();connectClicks();if(current){document.getElementById('back').onclick=()=>{current=null;messages=[];render();n.chats();};document.getElementById('compose').onsubmit=x=>{x.preventDefault();const draft=document.getElementById('draft');if(draft.value.trim()){n.send(current,draft.value);draft.value='';}};const s=document.getElementById('msgscroll');s.scrollTop=s.scrollHeight;}else{document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});document.querySelectorAll('[data-id]').forEach(row=>row.onclick=()=>{current=row.dataset.id;title=items.find(x=>x.id===current)?.title||'Sohbet';messages=[];render();n.history(current);});const search=document.getElementById('search');if(search)search.oninput=ev=>{q=ev.target.value;const point=search.selectionStart;const focus=search===document.activeElement;render();if(focus){const s=document.getElementById('search');s.focus();s.setSelectionRange(point,point);}};const logout=document.getElementById('logout');if(logout)logout.onclick=()=>{if(confirm('Telegram oturumundan çıkış yapılsın mı?'))n.logout();};}}
window.onTdEvent = function(v){if(v.type==='auth'){stage=v.value;if(stage!=='ready'){current=null;tab='chats';}render();}else if(v.type==='error'){notify('Telegram: '+v.value);}else if(v.type==='status'){if(stage==='otherdevice')notify(v.value);}else if(v.type==='me'){name=v.value;if(stage==='ready'&&!current&&tab==='settings')render();}else if(v.type==='chats'){items=v.items||[];if(stage==='ready'&&!current&&tab==='chats')render();}else if(v.type==='history'&&v.chat===current){messages=v.items||[];render();}else if(v.type==='message'&&v.chat===current){if(!messages.some(x=>x.id===v.id)){messages.push(v);render();}}};
window.armanBack=function(){if(current){current=null;messages=[];render();return true;}if(stage==='ready'&&tab!=='chats'){tab='chats';render();return true;}return false;};n.theme(dark);render();n.ready();})();
</script></body></html>
