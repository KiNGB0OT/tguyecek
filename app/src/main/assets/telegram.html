<script>
(() => {const n=window.TelegramNative;let stage='loading', current=null, title='', items=[], messages=[], q='', tab='chats', name='', dark=localStorage.getItem('arm-dark')==='1';if(dark)document.body.classList.add('dark');const root=document.getElementById('app');let toastTimer;function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function icon(){return `<span class="logo">A</span>`;}function head(){return `<header class="top"><div class="brand">${icon()}<span>ArmanUser</span></div><button class="pill" id="theme">${dark?'☀️':'🌙'}</button></header>`;}function connectClicks(){const t=document.getElementById('theme');if(t)t.onclick=()=>{dark=!dark;localStorage.setItem('arm-dark',dark?'1':'0');document.body.classList.toggle('dark',dark);n.theme(dark);render();};}function notify(t){let old=document.getElementById('toast');if(old)old.remove();const x=document.createElement('div');x.className='toast';x.id='toast';x.textContent=t;root.append(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),4200);}
function login(){let title='',desc='',fields='',action='';if(stage==='loading'){root.innerHTML=head()+`<div class="panel glass"><div class="spinner">Telegram bağlantısı hazırlanıyor…</div></div>`;connectClicks();return;}if(stage==='api'){title='Telegram API bağlantısı';desc='Bu resmi olmayan istemci için Telegram uygulama kimliğini bir kez gir. Bilgiler yalnızca telefonunda Android Keystore ile şifrelenerek saklanır.';fields=`<label>API ID</label><input name="id" type="number" inputmode="numeric" value="20672652" required placeholder="API ID"><label>API Hash</label><input name="hash" autocapitalize="none" autocomplete="off" required placeholder="32 karakterlik API Hash">`;action='API bilgilerini kaydet';}if(stage==='phone'){title='Telefon numaran';desc='Telegram hesabının telefon numarasını uluslararası biçimde gir.';fields=`<label>Telefon numarası</label><input name="value" type="tel" inputmode="tel" required placeholder="+90 5xx xxx xx xx">`;action='Doğrulama kodu iste';}if(stage==='code'){title='Doğrulama kodu';desc='Telegram uygulamasına veya numarana gelen kodu gir. Bu kod sadece Telegram sunucularına TDLib üzerinden gönderilir.';fields=`<label>Telegram kodu</label><input name="value" inputmode="numeric" autocomplete="one-time-code" required placeholder="Doğrulama kodu">`;action='Doğrula';}if(stage==='password'){title='İki aşamalı doğrulama';desc='Telegram hesabın için belirlediğin iki aşamalı doğrulama parolasını gir.';fields=`<label>Telegram parolan</label><input name="value" type="password" required placeholder="Parola">`;action='Giriş yap';}if(stage==='email'){title='E-posta doğrulama';desc='Telegram giriş için e-posta adresi talep ediyor.';fields=`<label>E-posta</label><input name="value" type="email" required placeholder="E-posta adresi">`;action='Devam';}if(stage==='emailcode'){title='E-posta kodu';desc='Telegram tarafından gönderilen e-posta kodunu gir.';fields=`<label>E-posta kodu</label><input name="value" required placeholder="Doğrulama kodu">`;action='Doğrula';}if(stage==='register'){title='Telegram kaydı';desc='Yeni hesap oluşturmak için adını gir.';fields=`<label>Ad</label><input name="value" required placeholder="Ad"><label>Soyad (isteğe bağlı)</label><input name="extra" placeholder="Soyad">`;action='Hesap oluştur';}if(stage==='otherdevice'){title='Telegram onayı';desc='Başka bir cihazdaki Telegram uygulaman üzerinden oturum açma isteğini onayla.';action='Bekleniyor';}
root.innerHTML=head()+`<main class="view"><section class="panel glass"><div class="title">${title}</div><p class="desc">${desc}</p><form id="login">${fields}<button class="primary" type="submit" ${stage==='otherdevice'?'disabled':''}>${action}</button></form>${stage==='api'?`<p class="info" style="margin-top:20px">API ID ve API Hash almak için telefon tarayıcında <b>my.telegram.org</b> adresinden <b>API development tools</b> bölümüne gir. <strong>Bu bilgileri bu sohbet üzerinden paylaşma.</strong></p>`:''}</section><div class="note">Bu bir Telegram istemcisidir, resmi Telegram uygulaması değildir. ARMAN AI henüz bağlı değildir.</div></main>`;connectClicks();const f=document.getElementById('login');f.onsubmit=ev=>{ev.preventDefault();const d=new FormData(f);if(stage==='api'){n.saveApi(d.get('id'),d.get('hash'));}else n.submit(stage,d.get('value')||'',d.get('extra')||'');f.querySelector('button').disabled=true;setTimeout(()=>{const b=f.querySelector('button');if(b)b.disabled=false;},2500);};}

const glyphs={
chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8A8.5 8.5 0 0 1 12.5 20a8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.5 8.5 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5Z"/>',
star:'<path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.4L12 17.6l-5.7 3 1.1-6.4L2.8 9.7l6.4-.9L12 3Z"/>',
group:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
channel:'<path d="m3 11 18-7-7 18-3.5-7.5L3 11ZM10.5 14.5 21 4"/>',
mention:'<circle cx="12" cy="12" r="9"/><path d="M16 9v4a2 2 0 0 0 4 0v-1a8 8 0 1 0-3.8 6.8"/><circle cx="12" cy="12" r="4"/>',
bot:'<rect x="4" y="7" width="16" height="14" rx="3"/><path d="M12 3v4M8 13h.01M16 13h.01M8 17h8"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
tune:'<path d="M4 7h16M4 17h16M9 4v6M16 14v6"/>',
back:'<path d="m15 18-6-6 6-6"/>',
send:'<path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1a8 8 0 0 0-2-1.2L14 3h-4l-.6 2.8a8 8 0 0 0-2 1.2l-2.3-1-2 3.5L5 11a7 7 0 0 0 0 2l-1.9 1.5 2 3.5 2.3-1a8 8 0 0 0 2 1.2L10 21h4l.6-2.8a8 8 0 0 0 2-1.2l2.3 1 2-3.5L19 13a7 7 0 0 0 0-1Z"/>',
person:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
pin:'<path d="m16 3 5 5-4 1-4 4 1 4-2 2-5-5-4 0 9-9 4-2ZM9 15l-6 6"/>',
sort:'<path d="M3 6h13M3 12h9M3 18h5M19 19V5m-4 4 4-4 4 4"/>',
mute:'<path d="M4 4l16 16M6 10v4l-2 2h12M10 21h4M18 8a6 6 0 0 0-6-6"/>',
more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
close:'<path d="M5 5 19 19M19 5 5 19"/>',
theme:'<path d="M20.5 15.5A8 8 0 0 1 8.5 3.5a8 8 0 1 0 12 12Z"/>'};
function g(key){return '<svg class="ar-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(glyphs[key]||glyphs.chat)+'</svg>';}
const folders=[['private','Özel Sohbetler','chat'],['favorite','Favoriler','star'],['group','Gruplar','group'],['channel','Kanallar','channel'],['mention','Etiketler','mention'],['managed','Bot Yönetimi','bot'],['bot','Bot Sohbetleri','bot']];
const avatarCache=Object.create(null);
let folder=localStorage.getItem('ar-folder')||'private',quick='all',descending=true;
let favorites=new Set(),pins=new Set();
try{favorites=new Set(JSON.parse(localStorage.getItem('ar-favorites')||'[]'));}catch(_){}
try{pins=new Set(JSON.parse(localStorage.getItem('ar-pins')||'[]'));}catch(_){}
let blur=Number(localStorage.getItem('ar-blur')||22);
document.documentElement.style.setProperty('--ar-blur',Math.min(42,Math.max(5,blur))+'px');
const saveLocal=()=>{localStorage.setItem('ar-favorites',JSON.stringify([...favorites]));localStorage.setItem('ar-pins',JSON.stringify([...pins]));};
const isPinned=x=>!!x.pinned||pins.has(String(x.id));
function inFolder(x,f){if(f==='favorite')return favorites.has(String(x.id));if(f==='mention')return x.kind==='group'&&Number(x.mentions||0)>0;if(f==='managed')return false;return (x.kind||'private')===f;}
function countFolder(f){return items.filter(x=>inFolder(x,f)).length;}
function timeFmt(t){if(!t)return '';const d=new Date(t*1000),today=new Date();return d.toDateString()===today.toDateString()?d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'});}
function nav(){return `<nav class="ar-bottom ar-glass">${[['chats','chat','Sohbetler'],['people','group','Kişiler'],['settings','settings','Ayarlar'],['profile','person','Profil']].map(([key,ic,t])=>`<button data-tab="${key}" class="${tab===key?'active':''}">${g(ic)}<span>${t}</span></button>`).join('')}</nav>`;}
function arHead(){return `<header class="ar-top"><div class="ar-head"><div class="ar-logo">${g('send')}</div><div class="ar-brand"><strong>ArmanUser</strong><small>Clean. Smart. Personal.</small></div><button class="ar-icon" id="ar-theme" aria-label="Temayı değiştir">${g('theme')}</button><button class="ar-icon" id="ar-options" aria-label="Menü">${g('more')}</button></div><label class="ar-searchbar ar-glass">${g('search')}<input id="ar-search" placeholder="Sohbet ara" value="${e(q)}" aria-label="Sohbet ara">${g('tune')}</label></header>`;}
function folderBar(){return `<div class="ar-folders" id="ar-folders">${folders.map(([id,t,ic])=>`<button class="ar-folder ${id===folder?'active':''}" data-folder="${id}" aria-pressed="${id===folder}">${g(ic)}<span class="ar-folder-title">${t}</span>${countFolder(id)?`<span class="ar-count">${Math.min(countFolder(id),999)}${countFolder(id)>999?'+':''}</span>`:''}</button>`).join('')}</div>`;}
function quickBar(){const unread=items.filter(x=>Number(x.unread||0)>0||x.markedUnread).length;return `<div class="ar-quick">${[['all','Tümü'],['unread','Okunmamış'+(unread?' · '+unread:'')],['pinned','Sabitlenenler']].map(([key,t])=>`<button data-quick="${key}" class="${key===quick?'active':''}">${key==='pinned'?g('pin'):''}${t}</button>`).join('')}<button id="ar-sort" class="ar-sort" aria-label="Sıralama">${g('sort')}</button></div>`;}
function filtered(){return items.filter(x=>inFolder(x,folder)&&((x.title||'').toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr'))||(x.last||'').toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr')))&& (quick==='unread'?(Number(x.unread||0)>0||x.markedUnread):quick==='pinned'?isPinned(x):true)).sort((a,b)=>isPinned(a)!==isPinned(b)?isPinned(a)?-1:1:(Number(b.date||0)-Number(a.date||0))*(descending?1:-1));}
function avatar(x){const kind=x.kind||'private',c=e((x.title||'?').trim().slice(0,1).toLocaleUpperCase('tr'));return `<div class="ar-avatar ${kind}" data-avatar-id="${e(x.id||'')}">${avatarCache[String(x.id)]?`<img src="${avatarCache[String(x.id)]}" alt="">`:kind==='channel'?g('channel'):kind==='bot'?g('bot'):c}</div>`;}
function empty(){let t='Burada henüz sohbet yok',s='Telegram sohbetlerin yüklendikçe bu alanda görünecek.';if(folder==='managed'){t='Bot Yönetimi';s='ARMAN USERBOT PRO bağlantısı yapıldığında botun yönettiği gruplar burada listelenecek. Henüz bağlı değil.';}else if(folder==='mention'){t='Yeni etiket bulunmuyor';s='Senden bahsedilen veya mesajına yanıt verilen grupların okunmamış bildirimleri burada gösterilir.';}else if(folder==='favorite'){t='Favorilerin boş';s='Bir sohbetin üzerine uzun basıp Favorilere Ekle seçeneğini kullanabilirsin.';}if(q){t='Eşleşme bulunamadı';s='Arama metnini veya kategoriyi değiştirebilirsin.';}else if(quick==='unread'){t='Okunmamış sohbet yok';s='Bu kategoride yeni mesaj bulunmuyor.';}else if(quick==='pinned'){t='Sabitlenen sohbet yok';s='Bir sohbete uzun basıp yerel olarak sabitleyebilirsin.';}return `<section class="ar-empty ar-glass">${g('chat')}<h3>${t}</h3><p>${s}</p></section>`;}
function row(x){return `<article class="ar-row" data-id="${e(x.id)}" role="button" tabindex="0" aria-label="${e(x.title)} sohbetini aç">${avatar(x)}<div class="ar-main"><div class="ar-name">${e(x.title)}${favorites.has(String(x.id))?' <span style="color:#f6af27">★</span>':''}${isPinned(x)?` ${g('pin').replace('ar-svg','ar-svg inline')}`:''}</div><div class="ar-preview">${e(x.last||'Mesaj bulunmuyor')}</div></div><div class="ar-meta"><span class="ar-time">${timeFmt(x.date)}</span>${x.kind==='group'&&Number(x.mentions||0)>0?`<span class="ar-mention-count">@${x.mentions}</span>`:Number(x.unread||0)>0?`<span class="ar-unread">${Number(x.unread)>99?'99+':x.unread}</span>`:x.muted?g('mute').replace('ar-svg','ar-svg inline'):''}</div></article>`;}
function chatList(){const d=filtered();return d.length?d.map(row).join(''):empty();}
function list(){const label=(folders.find(x=>x[0]===folder)||folders[0])[1];if(tab==='chats')return `<div class="ar-shell">${arHead()}${folderBar()}${quickBar()}<div class="ar-section"><span>${label}</span><span>${filtered().length} sohbet</span></div><main id="ar-list" class="ar-list">${chatList()}</main>${nav()}</div>`;
if(tab==='people'){const p=items.filter(x=>x.kind==='private'&&(x.title||'').toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr'))).sort((a,b)=>(a.title||'').localeCompare(b.title||'','tr'));return `<div class="ar-shell">${arHead()}<div class="ar-section"><span>Konuştuğun kişiler</span><span>${p.length} kişi</span></div><main class="ar-list" id="ar-list">${p.map(row).join('')||empty()}</main>${nav()}</div>`;}
if(tab==='settings')return `<div class="ar-shell">${arHead()}<div class="ar-section">Görünüm ve uygulama</div><main class="ar-list"><section class="ar-panel ar-glass"><h3>Liquid Glass</h3><p>Cam yoğunluğunu ve temayı ayarlayabilirsin.</p><div class="ar-panel-line"><span>Görünüm</span><button id="ar-theme-toggle">${dark?'Açık moda geç':'Koyu moda geç'}</button></div><div class="ar-panel-line"><span>Cam bulanıklığı</span><input id="ar-blur" type="range" min="5" max="42" value="${blur}" style="width:55%;accent-color:#1685fb"></div></section><section class="ar-panel ar-glass"><h3>Sohbet Kategorileri</h3><p>Telegram'ın gerçek özel sohbet, grup ve kanal türlerini kullanıyoruz. Favoriler ve yerel sabitlemeler cihazında saklanıyor.</p><div class="ar-panel-line"><span>Favoriler</span><b>${favorites.size}</b></div><div class="ar-panel-line"><span>Yerel sabitlemeler</span><b>${pins.size}</b></div></section><section class="ar-panel ar-glass"><h3>Telegram hesabı</h3><p>TDLib bağlantısı açık. API bilgileri cihazında Android Keystore ile şifreleniyor.</p><button class="danger" id="logout">Telegram'dan çıkış yap</button></section></main>${nav()}</div>`;
return `<div class="ar-shell">${arHead()}<div class="ar-section">Profil</div><main class="ar-list"><section class="ar-panel ar-glass" style="text-align:center;padding:28px"><div class="ar-avatar" style="width:72px;height:72px;margin:0 auto 15px">${e((name||'?').slice(0,1))}</div><h3>${e(name||'Telegram hesabım')}</h3><p>ArmanUser Messenger v0.5</p></section><section class="ar-panel ar-glass"><h3>ARMAN AI ve Bot Yönetimi</h3><p>Bu modüller, güvenli ARMAN USERBOT PRO API bağlantısı kurulduktan sonra aktifleşecek.</p></section></main>${nav()}</div>`;}
function conversation(){const c=items.find(x=>String(x.id)===String(current))||{title};return `<div class="ar-shell"><header class="ar-chathead ar-glass"><button class="ar-icon" id="ar-back" aria-label="Geri">${g('back')}</button>${avatar(c)}<div class="ar-chathead-title"><strong>${e(title)}</strong><small>${c.kind==='group'?'Grup':c.kind==='channel'?'Kanal':c.kind==='bot'?'Bot':'Özel sohbet'}</small></div><button id="ar-more-chat" class="ar-icon" aria-label="Sohbet seçenekleri">${g('more')}</button></header><main class="ar-msgscroll" id="ar-msgscroll"><div class="ar-msgstack">${messages.length?messages.map(x=>`<div class="ar-bubble ${x.out?'mine':''}">${!x.out&&x.sender?`<div class="ar-sender">${e(x.sender)}</div>`:''}${e(x.text||'Mesaj')}<span class="ar-msgtime">${timeFmt(x.date)}</span></div>`).join(''):'<div class="ar-empty">Mesajlar yükleniyor…</div>'}</div></main><form class="ar-compose-bar ar-glass" id="ar-compose"><input id="ar-draft" autocomplete="off" placeholder="Mesaj yaz…"><button type="submit" aria-label="Gönder">${g('send')}</button></form></div>`;}
function openChat(id){current=String(id);title=(items.find(x=>String(x.id)===current)||{}).title||'Sohbet';messages=[];render();n.history(current);}
function sheet(id){const x=items.find(a=>String(a.id)===String(id));if(!x)return;const fav=favorites.has(String(id)),pin=pins.has(String(id));const overlay=document.createElement('div');overlay.className='ar-overlay';overlay.innerHTML=`<section class="ar-sheet ar-glass"><strong>${e(x.title)}</strong><button data-action="fav">${g('star')}${fav?'Favorilerden çıkar':'Favorilere ekle'}</button><button data-action="pin">${g('pin')}${pin?'Yerel sabitlemeyi kaldır':'Yerel olarak sabitle'}</button><button data-action="open">${g('chat')}Sohbeti aç</button><button data-action="cancel">${g('close')}Vazgeç</button></section>`;overlay.onclick=ev=>{if(ev.target===overlay)overlay.remove();};overlay.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='fav'){if(fav)favorites.delete(String(id));else favorites.add(String(id));saveLocal();}if(a==='pin'){if(pin)pins.delete(String(id));else pins.add(String(id));saveLocal();}overlay.remove();if(a==='open')openChat(id);else render();});root.append(overlay);}
function bindRows(){document.querySelectorAll('.ar-row[data-id]').forEach(el=>{const id=String(el.dataset.id);let press,long=false,x0=0,y0=0;el.onclick=()=>{if(!long)openChat(id);long=false;};el.oncontextmenu=ev=>{ev.preventDefault();sheet(id);return false;};el.onkeydown=ev=>{if(ev.key==='Enter')openChat(id);else if(ev.key===' '){ev.preventDefault();sheet(id);}};el.addEventListener('touchstart',ev=>{long=false;x0=ev.touches[0].clientX;y0=ev.touches[0].clientY;clearTimeout(press);press=setTimeout(()=>{long=true;sheet(id);},550);},{passive:true});el.addEventListener('touchmove',ev=>{if(Math.abs(ev.touches[0].clientY-y0)>13||Math.abs(ev.touches[0].clientX-x0)>13)clearTimeout(press);},{passive:true});el.addEventListener('touchend',ev=>{clearTimeout(press);const dx=ev.changedTouches[0].clientX-x0,dy=ev.changedTouches[0].clientY-y0;if(!long&&Math.abs(dx)>78&&Math.abs(dx)>Math.abs(dy)*1.8){long=true;if(dx>0){favorites.has(id)?favorites.delete(id):favorites.add(id);}else{pins.has(id)?pins.delete(id):pins.add(id);}saveLocal();render();}if(long)setTimeout(()=>{long=false;},300);},{passive:true});el.addEventListener('touchcancel',()=>clearTimeout(press),{passive:true});});}
function render(){if(stage!=='ready'){login();return;}const cs=document.getElementById('ar-folders'),pos=cs?cs.scrollLeft:0,old=document.getElementById('ar-list'),y=old?old.scrollTop:0;root.innerHTML=current?conversation():list();const newCats=document.getElementById('ar-folders'),newList=document.getElementById('ar-list');if(newCats)newCats.scrollLeft=pos;if(newList)newList.scrollTop=y;bindApp();}
function bindApp(){const changeTheme=()=>{dark=!dark;localStorage.setItem('arm-dark',dark?'1':'0');document.body.classList.toggle('dark',dark);n.theme(dark);render();};for(const id of ['ar-theme','ar-theme-toggle']){const b=document.getElementById(id);if(b)b.onclick=changeTheme;}const opt=document.getElementById('ar-options');if(opt)opt.onclick=()=>{tab='settings';render();};const range=document.getElementById('ar-blur');if(range)range.oninput=()=>{blur=Number(range.value);localStorage.setItem('ar-blur',String(blur));document.documentElement.style.setProperty('--ar-blur',blur+'px');};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;q='';current=null;render();});document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folder=b.dataset.folder;localStorage.setItem('ar-folder',folder);quick='all';q='';render();const a=document.querySelector('.ar-folder.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});});document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{quick=b.dataset.quick;render();});const s=document.getElementById('ar-sort');if(s)s.onclick=()=>{descending=!descending;render();};const search=document.getElementById('ar-search');if(search)search.oninput=ev=>{q=ev.target.value;const target=document.getElementById('ar-list');if(target){target.innerHTML=tab==='people'?items.filter(x=>x.kind==='private'&&(x.title||'').toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr'))).map(row).join('')||empty():chatList();bindRows();}};bindRows();const b=document.getElementById('ar-back');if(b)b.onclick=()=>{current=null;messages=[];render();n.chats();};const c=document.getElementById('ar-compose');if(c)c.onsubmit=ev=>{ev.preventDefault();const input=document.getElementById('ar-draft');if(input.value.trim()){n.send(current,input.value.trim());input.value='';}};const m=document.getElementById('ar-more-chat');if(m)m.onclick=()=>sheet(current);const ms=document.getElementById('ar-msgscroll');if(ms)ms.scrollTop=ms.scrollHeight;const logout=document.getElementById('logout');if(logout)logout.onclick=()=>{if(confirm('Telegram hesabından çıkış yapılsın mı?'))n.logout();};}
window.onTdEvent=function(v){if(v.type==='auth'){stage=v.value;if(stage!=='ready'){current=null;tab='chats';}render();}else if(v.type==='error'){notify('Telegram: '+v.value);}else if(v.type==='status'){if(stage==='otherdevice')notify(v.value);}else if(v.type==='me'){name=v.value;if(stage==='ready'&&!current&&tab==='profile')render();}else if(v.type==='chats'){items=v.items||[];if(stage==='ready'&&!current&&tab!=='settings'&&tab!=='profile')render();}else if(v.type==='history'&&String(v.chat)===String(current)){messages=v.items||[];render();}else if(v.type==='avatar'){avatarCache[String(v.chat)]=v.data;document.querySelectorAll('[data-avatar-id]').forEach(a=>{if(a.dataset.avatarId===String(v.chat))a.innerHTML='<img alt="" src="'+v.data+'">';});}else if(v.type==='message'&&String(v.chat)===String(current)){if(!messages.some(x=>x.id===v.id)){messages.push(v);render();}}};
window.armanBack=function(){const overlay=document.querySelector('.ar-overlay');if(overlay){overlay.remove();return true;}if(current){current=null;messages=[];render();return true;}if(stage==='ready'&&tab!=='chats'){tab='chats';render();return true;}if(stage==='ready'&&folder!=='private'){folder='private';render();return true;}return false;};
n.theme(dark);render();n.ready();

})();
</script></body></html>
