/* v0.6: fixed header, inset-safe input and clear group sender identity */
.ar-chathead{position:relative;z-index:5;flex:0 0 auto;min-height:67px;padding:9px 13px 11px;border-top:0;border-radius:0 0 24px 24px}
.ar-chathead-title strong{font-size:15px;line-height:1.24}
.ar-chathead .ar-icon{min-width:43px;min-height:43px}
.ar-msgscroll{min-height:0;flex:1 1 0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:15px 9px 13px}
.ar-msgstack{display:flex;flex-direction:column;gap:11px;margin-top:auto;width:100%}
.ar-msgline{display:flex;align-items:flex-end;gap:7px;width:100%;flex-shrink:0}
.ar-msgline.mine{justify-content:flex-end}
.ar-msgline.other{justify-content:flex-start}
.ar-msgline .ar-bubble{max-width:min(84%,450px);align-self:auto}
.ar-msgline.other.group .ar-bubble{max-width:calc(100% - 45px)}
.ar-sender-avatar{width:30px;height:30px;min-width:30px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#86b5f8,#5973d5);color:white;font-size:13px;font-weight:800;border:1px solid #ffffffad;box-shadow:0 2px 5px #45648c22}
.ar-sender-avatar img{width:100%;height:100%;object-fit:cover}
.ar-sender-avatar.tone1{background:linear-gradient(145deg,#ffad79,#df775b)}
.ar-sender-avatar.tone2{background:linear-gradient(145deg,#90c4a6,#399980)}
.ar-sender-avatar.tone3{background:linear-gradient(145deg,#db9ee9,#9674d8)}
.ar-sender-avatar.tone4{background:linear-gradient(145deg,#f2d28b,#e59b43)}
.ar-sender-avatar.tone5{background:linear-gradient(145deg,#85b5f8,#547fd0)}
.ar-sender{font-size:12px;font-weight:820;line-height:1.25;margin-bottom:5px;color:#237eaa}
.ar-sender.tone1{color:#cb7147}
.ar-sender.tone2{color:#2b9275}
.ar-sender.tone3{color:#9d5dc1}
.ar-sender.tone4{color:#bd8242}
.ar-sender.tone5{color:#4588c7}
.dark .ar-sender.tone1{color:#ffb38b}
.dark .ar-sender.tone2{color:#85d6b4}
.dark .ar-sender.tone3{color:#d4a1fa}
.dark .ar-sender.tone4{color:#e7c081}
.dark .ar-sender.tone5{color:#99caff}
.ar-msgline.group.other .ar-bubble{padding:10px 12px 7px}
.ar-compose-bar{flex:0 0 auto;position:relative;z-index:5;min-height:70px;gap:9px;align-items:center;padding:10px 12px 12px;border-radius:23px 23px 0 0}
.ar-compose-bar input{min-height:48px;height:48px;font-size:16px;line-height:1.4;padding:0 16px;touch-action:manipulation}
.ar-compose-bar button{width:48px;height:48px;min-width:48px;min-height:48px;touch-action:manipulation}
#ar-msgscroll:focus{outline:0}


/* v0.9 usable chat composer, media tools and history */
.ar-tools{display:flex;align-items:center;gap:5px;flex:0 0 auto;padding:5px 12px 7px;border-radius:21px 21px 0 0;min-height:42px}
.ar-tools button{border:1px solid var(--ar-line);border-radius:14px;height:34px;min-width:34px;display:grid;place-items:center;background:var(--ar-glass);color:var(--ar-ink);font-size:17px;padding:0 8px;touch-action:manipulation}
.ar-tools .ar-ttl{margin-left:auto;height:34px;max-width:122px;background:var(--ar-glass);border:1px solid var(--ar-line);border-radius:13px;font-size:12px;font-weight:700;color:var(--ar-ink);padding:0 7px;outline:none}
.ar-media-palette{max-height:202px;overflow-y:auto;flex:none;border-radius:18px 18px 0 0;margin:0 10px;padding:11px;background:var(--ar-glass);border:1px solid var(--ar-line);box-shadow:0 3px 10px #4472a311}
.ar-media-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ar-media-grid button{border:0;border-radius:12px;min-height:43px;background:var(--ar-card);font-size:23px;color:var(--ar-ink);padding:4px;overflow:hidden;text-overflow:ellipsis}
.ar-media-grid button.sticker{font-size:21px}
.ar-media-grid button.gif{font-size:12px;min-width:0;max-width:100%;word-break:break-all}
.ar-media-info{font-size:12px;color:var(--ar-muted);line-height:1.4;margin:0 0 9px}
.ar-msgscroll{scrollbar-width:none;touch-action:pan-y}
.ar-msgstack:empty{min-height:16px}
.ar-pager{font-size:12px;text-align:center;padding:10px;color:var(--ar-muted)}
.ar-unread-dot{display:grid;place-items:center}
.ar-compose-bar{min-height:62px;padding:7px 10px 10px;border-radius:0 0 0 0}
.ar-compose-bar input{height:48px;min-height:48px;font-size:16px;touch-action:manipulation}
.ar-compose-bar button{width:48px;height:48px;min-width:48px;min-height:48px}
.ar-chathead{position:relative;z-index:6;flex:none}

<script>
(() => {const n=window.TelegramNative;let stage='loading', current=null, title='', items=[], messages=[], q='', tab='chats', name='', dark=localStorage.getItem('arm-dark')==='1';if(dark)document.body.classList.add('dark');const root=document.getElementById('app');let toastTimer;
let authSubmitting=false,worldCountries=[],authCountryCode=localStorage.getItem('arman-country')||'';
const globalPhoneHint='Uluslararası numara: +994 51 485 84 96 / +90 5xx ... / +1 ...';
function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function icon(){return `<span class="logo">A</span>`;}function head(){return `<header class="top"><div class="brand">${icon()}<span>ArmanUser</span></div><button class="pill" id="theme">${dark?'☀️':'🌙'}</button></header>`;}function connectClicks(){const t=document.getElementById('theme');if(t)t.onclick=()=>{dark=!dark;localStorage.setItem('arm-dark',dark?'1':'0');document.body.classList.toggle('dark',dark);n.theme(dark);render();};}function notify(t){let old=document.getElementById('toast');if(old)old.remove();const x=document.createElement('div');x.className='toast';x.id='toast';x.textContent=t;root.append(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),4200);}

function countryFlag(iso){try{return String.fromCodePoint(...iso.toUpperCase().split('').map(c=>c.charCodeAt(0)+127397));}catch(_){return '🌐';}}
function countryOptions(){
 const seen=new Set();
 const list=worldCountries.filter(c=>c&&c.callingCode&&c.iso).sort((a,b)=>String(a.english||a.name).localeCompare(String(b.english||b.name),'en'));
 return '<option value="">Ülke seç (isteğe bağlı) • Select country</option>'+
 list.filter(c=>{const key=c.iso+'-'+c.callingCode;if(seen.has(key))return false;seen.add(key);return true;})
 .map(c=>'<option value="'+e(c.callingCode)+'" '+(String(c.callingCode)===String(authCountryCode)?'selected':'')+'>'+countryFlag(c.iso)+' '+e(c.english||c.name)+' (+'+e(c.callingCode)+')</option>').join('');
}
function refreshCountryOptions(){
 const sel=document.getElementById('arman-country');
 if(!sel)return;
 const old=sel.value||authCountryCode;
 sel.innerHTML=countryOptions();
 if(old&&[...sel.options].some(o=>o.value===old))sel.value=old;
}
function login(){
 let title='',desc='',fields='',action='';
 if(stage==='loading'){
   root.innerHTML=head()+'<div class="panel glass"><div class="spinner">Telegram bağlantısı hazırlanıyor…</div></div>';
   connectClicks();return;
 }
 if(stage==='api'){
   title='Telegram API bağlantısı';
   desc='Uygulama geliştirici kimliği yapılandırılmamış. Bu bilgi normal kullanıcılardan istenmez.';
   fields='<label>API ID</label><input name="id" type="number" inputmode="numeric" required placeholder="API ID"><label>API Hash</label><input name="hash" autocapitalize="none" autocomplete="off" required placeholder="API Hash">';
   action='API bilgilerini kaydet';
 }
 if(stage==='phone'){
   title='Telegram hesabına giriş';
   desc='Dünyanın her ülkesinden numarayla giriş yapabilirsin. Ülke seç veya telefon numaranı +uluslararası koduyla doğrudan yaz.';
   fields='<label>Ülke / Country</label><select id="arman-country" aria-label="Ülke / Country">'+countryOptions()+'</select>'+
     '<label>Telefon / Phone</label><input name="value" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+994 51 485 84 96" aria-label="Uluslararası telefon numarası">'+
     '<p class="ar-phone-hint">'+globalPhoneHint+'</p>';
   action='Kod iste / Send code';
 }
 if(stage==='code'){
   title='Doğrulama kodu';
   desc='Kod Telegram uygulamasına, SMS ile veya hesabının güvenlik ayarlarına bağlı başka bir yöntemle gönderilir.';
   fields='<label>Doğrulama kodu</label><input name="value" inputmode="numeric" autocomplete="one-time-code" required placeholder="Kod">';
   action='Doğrula';
 }
 if(stage==='password'){
   title='İki aşamalı doğrulama';desc='Telegram hesabın için belirlediğin iki aşamalı doğrulama parolasını gir.';
   fields='<label>Telegram parolan</label><input name="value" type="password" autocomplete="current-password" required placeholder="Parola">';
   action='Giriş yap';
 }
 if(stage==='email'){
   title='E-posta doğrulama';desc='Telegram giriş için e-posta adresi talep ediyor.';
   fields='<label>E-posta</label><input name="value" type="email" required placeholder="E-posta adresi">';action='Devam';
 }
 if(stage==='emailcode'){
   title='E-posta kodu';desc='Telegram tarafından gönderilen e-posta kodunu gir.';
   fields='<label>E-posta kodu</label><input name="value" inputmode="numeric" required placeholder="Doğrulama kodu">';action='Doğrula';
 }
 if(stage==='register'){
   title='Telegram kaydı';desc='Yeni hesap oluşturmak için adını gir.';
   fields='<label>Ad</label><input name="value" required placeholder="Ad"><label>Soyad (isteğe bağlı)</label><input name="extra" placeholder="Soyad">';
   action='Hesap oluştur';
 }
 if(stage==='otherdevice'){title='Telegram onayı';desc='Başka bir cihazdaki Telegram uygulaman üzerinden oturum açma isteğini onayla.';action='Bekleniyor';}
 root.innerHTML=head()+
   '<main class="view"><section class="panel glass"><div class="title">'+e(title)+'</div><p class="desc">'+e(desc)+'</p>'+
   '<form id="login">'+fields+'<button id="arman-login-submit" class="primary" type="submit" '+(stage==='otherdevice'||authSubmitting?'disabled':'')+'>'+e(action)+'</button>'+
   '<p class="ar-auth-feedback" id="ar-auth-feedback" aria-live="polite">'+(authSubmitting?'Telegram yanıtı bekleniyor…':'')+'</p></form></section>'+
   '<div class="note">ArmanUser Messenger bağımsız bir Telegram istemcisidir. Telegram tarafından resmî olarak geliştirilmemiştir.</div></main>';
 connectClicks();
 const form=document.getElementById('login');
 const sel=document.getElementById('arman-country');
 if(sel)sel.onchange=()=>{authCountryCode=sel.value;localStorage.setItem('arman-country',authCountryCode);};
 if(!form)return;
 form.onsubmit=ev=>{
   ev.preventDefault();
   if(authSubmitting)return;
   const formData=new FormData(form);
   if(stage==='api') {
     authSubmitting=true;
     n.saveApi(formData.get('id')||'',formData.get('hash')||'');
   }else {
     let value=String(formData.get('value')||'');
     if(stage==='phone'){
       value=value.replace(/[ \t\r\n()\u00a0\-]/g,'');
       const code=sel?sel.value:'';
       if(!value.startsWith('+')){
         if(!code){notify('Ülke seç veya numarayı +ülke koduyla yaz.');return;}
         value='+'+code+value.replace(/^0+/,'');
       }
       if(!/^\+[1-9][0-9]{6,14}$/.test(value)){
         notify('Uluslararası numara geçersiz. Örnek: +994514858496');return;
       }
     }
     authSubmitting=true;
     n.submit(stage,value,String(formData.get('extra')||''));
   }
   const button=document.getElementById('arman-login-submit');
   if(button)button.disabled=true;
   const msg=document.getElementById('ar-auth-feedback');
   if(msg)msg.textContent='Telegram yanıtı bekleniyor…';
 };
}

function g(key){return '<svg class="ar-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(glyphs[key]||glyphs.chat)+'</svg>';}
const folders=[['private','Özel Sohbetler','chat'],['favorite','Favoriler','star'],['group','Gruplar','group'],['channel','Kanallar','channel'],['mention','Etiketler','mention'],['managed','Bot Yönetimi','bot'],['bot','Bot Sohbetleri','bot']];
const avatarCache=Object.create(null);
const senderNames=Object.create(null),senderAvatars=Object.create(null);
let mediaPalette='',paletteItems=[],ttlSelection='0',historyOldest='0',historyBusy=false,historyExhausted=false,historyTries=0;
let folder=localStorage.getItem('ar-folder')||'private',quick='all',descending=true;
let favorites=new Set(),pins=new Set();
try{favorites=new Set(JSON.parse(localStorage.getItem('ar-favorites')||'[]'));}catch(_){}
try{pins=new Set(JSON.parse(localStorage.getItem('ar-pins')||'[]'));}catch(_){}
let blur=Number(localStorage.getItem('ar-blur')||22);
document.documentElement.style.setProperty('--ar-blur',Math.min(42,Math.max(5,blur))+'px');
const saveLocal=()=>{localStorage.setItem('ar-favorites',JSON.stringify([...favorites]));localStorage.setItem('ar-pins',JSON.stringify([...pins]));};
const isPinned=x=>!!x.pinned||pins.has(String(x.id));
function inFolder(x,f){if(f==='favorite')return favorites.has(String(x.id));if(f==='mention')return x.kind==='group'&&Number(x.mentions||0)>0;if(f==='managed')return false;return (x.kind||'private')===f;}
function countFolder(f){return items.filter(x=>inFolder(x,f)).reduce((sum,x)=>sum+(f==='mention'?Number(x.mentions||0):(Number(x.unread||0)>0||x.markedUnread?1:0)),0);}
function timeFmt(t){if(!t)return '';const d=new Date(t*1000),today=new Date();return d.toDateString()===today.toDateString()?d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'});}
function nav(){return `<nav class="ar-bottom ar-glass">${[['chats','chat','Sohbetler'],['people','group','Kişiler'],['settings','settings','Ayarlar'],['profile','person','Profil']].map(([key,ic,t])=>`<button data-tab="${key}" class="${tab===key?'active':''}">${g(ic)}<span>${t}</span></button>`).join('')}</nav>`;}
function arHead(){return `<header class="ar-top"><div class="ar-head"><div class="ar-logo">${g('send')}</div><div class="ar-brand"><strong>ArmanUser</strong><small>Clean. Smart. Personal.</small></div><button class="ar-icon" id="ar-theme" aria-label="Temayı değiştir">${g('theme')}</button><button class="ar-icon" id="ar-options" aria-label="Menü">${g('more')}</button></div><label class="ar-searchbar ar-glass">${g('search')}<input id="ar-search" placeholder="Sohbet ara" value="${e(q)}" aria-label="Sohbet ara">${g('tune')}</label></header>`;}
function folderBar(){return `<div class="ar-folders" id="ar-folders">${folders.map(([id,t,ic])=>`<button class="ar-folder ${id===folder?'active':''}" data-folder="${id}" aria-pressed="${id===folder}">${g(ic)}<span class="ar-folder-title">${t}</span>${countFolder(id)?`<span class="ar-count">${Math.min(countFolder(id),999)}${countFolder(id)>999?'+':''}</span>`:''}</button>`).join('')}</div>`;}
function quickBar(){const unread=items.filter(x=>inFolder(x,folder)&&(Number(x.unread||0)>0||x.markedUnread)).length;return `<div class="ar-quick">${[['all','Tümü'],['unread','Okunmamış'+(unread?' · '+unread:'')],['pinned','Sabitlenenler']].map(([key,t])=>`<button data-quick="${key}" class="${key===quick?'active':''}">${key==='pinned'?g('pin'):''}${t}</button>`).join('')}<button id="ar-sort" class="ar-sort" aria-label="Sıralama">${g('sort')}</button></div>`;}
function filtered(){return items.filter(x=>inFolder(x,folder)&&((x.title||'').toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr'))||(x.last||'').toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr')))&& (quick==='unread'?(Number(x.unread||0)>0||x.markedUnread):quick==='pinned'?isPinned(x):true)).sort((a,b)=>isPinned(a)!==isPinned(b)?isPinned(a)?-1:1:(Number(b.date||0)-Number(a.date||0))*(descending?1:-1));}
function avatar(x){const kind=x.kind||'private',c=e((x.title||'?').trim().slice(0,1).toLocaleUpperCase('tr'));return `<div class="ar-avatar ${kind}" data-avatar-id="${e(x.id||'')}">${avatarCache[String(x.id)]?`<img src="${avatarCache[String(x.id)]}" alt="">`:kind==='channel'?g('channel'):kind==='bot'?g('bot'):c}</div>`;}
function empty(){let t='Burada henüz sohbet yok',s='Telegram sohbetlerin yüklendikçe bu alanda görünecek.';if(folder==='managed'){t='Bot Yönetimi';s='ARMAN USERBOT PRO bağlantısı yapıldığında botun yönettiği gruplar burada listelenecek. Henüz bağlı değil.';}else if(folder==='mention'){t='Yeni etiket bulunmuyor';s='Senden bahsedilen veya mesajına yanıt verilen grupların okunmamış bildirimleri burada gösterilir.';}else if(folder==='favorite'){t='Favorilerin boş';s='Bir sohbetin üzerine uzun basıp Favorilere Ekle seçeneğini kullanabilirsin.';}if(q){t='Eşleşme bulunamadı';s='Arama metnini veya kategoriyi değiştirebilirsin.';}else if(quick==='unread'){t='Okunmamış sohbet yok';s='Bu kategoride yeni mesaj bulunmuyor.';}else if(quick==='pinned'){t='Sabitlenen sohbet yok';s='Bir sohbete uzun basıp yerel olarak sabitleyebilirsin.';}return `<section class="ar-empty ar-glass">${g('chat')}<h3>${t}</h3><p>${s}</p></section>`;}
function row(x){return `<article class="ar-row" data-id="${e(x.id)}" role="button" tabindex="0" aria-label="${e(x.title)} sohbetini aç">${avatar(x)}<div class="ar-main"><div class="ar-name">${e(x.title)}${favorites.has(String(x.id))?' <span style="color:#f6af27">★</span>':''}${isPinned(x)?` ${g('pin').replace('ar-svg','ar-svg inline')}`:''}</div><div class="ar-preview">${e(x.last||'Mesaj bulunmuyor')}</div></div><div class="ar-meta"><span class="ar-time">${timeFmt(x.date)}</span>${x.kind==='group'&&Number(x.mentions||0)>0?`<span class="ar-mention-count">@${x.mentions}</span>`:Number(x.unread||0)>0?`<span class="ar-unread">${Number(x.unread)>99?'99+':x.unread}</span>`:x.muted?g('mute').replace('ar-svg','ar-svg inline'):''}</div></article>`;}
function chatList(){const d=filtered();return d.length?d.map(row).join(''):empty();}
function list(){const label=(folders.find(x=>x[0]===folder)||folders[0])[1];if(tab==='chats')return `<div class="ar-shell">${arHead()}${folderBar()}${quickBar()}<div class="ar-section"><span>${label}</span><span>${filtered().length} sohbet</span></div><main id="ar-list" class="ar-list">${chatList()}</main>${nav()}</div>`;
if(tab==='people'){const p=items.filter(x=>x.kind==='private'&&(x.title||'').toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr'))).sort((a,b)=>(a.title||'').localeCompare(b.title||'','tr'));return `<div class="ar-shell">${arHead()}<div class="ar-section"><span>Konuştuğun kişiler</span><span>${p.length} kişi</span></div><main class="ar-list" id="ar-list">${p.map(row).join('')||empty()}</main>${nav()}</div>`;}
if(tab==='settings')return `<div class="ar-shell">${arHead()}<div class="ar-section">Görünüm ve uygulama</div><main class="ar-list"><section class="ar-panel ar-glass"><h3>Liquid Glass</h3><p>Cam yoğunluğunu ve temayı ayarlayabilirsin.</p><div class="ar-panel-line"><span>Görünüm</span><button id="ar-theme-toggle">${dark?'Açık moda geç':'Koyu moda geç'}</button></div><div class="ar-panel-line"><span>Cam bulanıklığı</span><input id="ar-blur" type="range" min="5" max="42" value="${blur}" style="width:55%;accent-color:#1685fb"></div></section><section class="ar-panel ar-glass"><h3>Sohbet Kategorileri</h3><p>Telegram'ın gerçek özel sohbet, grup ve kanal türlerini kullanıyoruz. Favoriler ve yerel sabitlemeler cihazında saklanıyor.</p><div class="ar-panel-line"><span>Favoriler</span><b>${favorites.size}</b></div><div class="ar-panel-line"><span>Yerel sabitlemeler</span><b>${pins.size}</b></div></section><section class="ar-panel ar-glass"><h3>Telegram hesabı</h3><p>TDLib bağlantısı açık. API bilgileri cihazında Android Keystore ile şifreleniyor.</p><button class="danger" id="logout">Telegram'dan çıkış yap</button></section></main>${nav()}</div>`;
return `<div class="ar-shell">${arHead()}<div class="ar-section">Profil</div><main class="ar-list"><section class="ar-panel ar-glass" style="text-align:center;padding:28px"><div class="ar-avatar" style="width:72px;height:72px;margin:0 auto 15px">${e((name||'?').slice(0,1))}</div><h3>${e(name||'Telegram hesabım')}</h3><p>ArmanUser Messenger v0.5</p></section><section class="ar-panel ar-glass"><h3>ARMAN AI ve Bot Yönetimi</h3><p>Bu modüller, güvenli ARMAN USERBOT PRO API bağlantısı kurulduktan sonra aktifleşecek.</p></section></main>${nav()}</div>`;}

function senderTone(key){const str=String(key||'');let hash=0;for(let i=0;i<str.length;i++)hash=(hash*31+str.charCodeAt(i))>>>0;return 'tone'+(hash%5+1);}
function messageBubble(m,isGroup){
 const mine=!!m.out,group=!!isGroup&&!mine;
 const key=String(m.senderKey||'');
 const name=senderNames[key]||m.sender||'Katılımcı';
 const tone=senderTone(key);
 const initials=e((name||'?').trim().slice(0,1).toLocaleUpperCase('tr-TR'));
 const avatar=group?'<div class="ar-sender-avatar '+tone+'" data-sender-avatar="'+e(key)+'">'+(senderAvatars[key]?'<img alt="" src="'+e(senderAvatars[key])+'">':initials)+'</div>':'';
 const sender=group?'<div class="ar-sender '+tone+'" data-sender-name="'+e(key)+'">'+e(name)+'</div>':'';
 return '<div class="ar-msgline '+(mine?'mine':'other')+(group?' group':'')+'">'+avatar+'<div class="ar-bubble '+(mine?'mine':'')+'">'+sender+e(m.text||'Mesaj')+'<span class="ar-msgtime">'+timeFmt(m.date)+'</span></div></div>';
}

    +'<button data-ar-palette="gif" title="GIF" aria-label="GIF">GIF</button>'
    +(privateChat?'<select id="ar-ttl" class="ar-ttl" aria-label="Süreli medya" title="Yalnızca bu sohbette göndereceğin yeni fotoğraf veya video için">'
    +[['0','Normal'],['-1','Tek görüntüleme'],['5','5 sn'],['10','10 sn'],['30','30 sn'],['60','60 sn']].map(([v,t])=>'<option value="'+v+'" '+(ttlSelection===v?'selected':'')+'>'+t+'</option>').join('')+'</select>':'')
    +'</div>';
}
function paletteUI(){
 if(!mediaPalette)return '';
 const text=mediaPalette==='emoji'?'Emoji seç':mediaPalette==='sticker'?'Son kullanılan çıkartmalar':"Kaydedilmiş GIF'ler";
 const cells=mediaPalette==='emoji'
   ?EMOJI_SET.map((symbol,i)=>'<button data-ar-emoji="'+i+'" aria-label="'+symbol+'">'+symbol+'</button>').join('')
   :paletteItems.map(x=>'<button class="'+mediaPalette+'" data-ar-saved="'+e(x.id)+'" title="'+e(x.label||'')+'">'+(mediaPalette==='gif'?'🎞 '+e(String(x.label||'GIF').slice(0,12)):e(x.label||'🎨'))+'</button>').join('');
 const empty=mediaPalette!=='emoji'&&!paletteItems.length?'<p class="ar-media-info">Henüz kayıtlı '+(mediaPalette==='gif'?'GIF':'çıkartma')+' bulunmuyor. Telefonundan dosya seçebilirsin.</p>':'';
 const fromFile=mediaPalette==='emoji'?'':'<button id="ar-palette-file" style="font-size:12px;background:#2489fa;color:#fff;padding:10px;border:0;border-radius:12px;margin-top:10px">📎 Telefondan '+(mediaPalette==='gif'?'GIF':'çıkartma')+' seç</button>';
 return '<section class="ar-media-palette" id="ar-media-palette"><p class="ar-media-info">'+text+'</p><div class="ar-media-grid">'+cells+'</div>'+empty+fromFile+'</section>';
}
function conversation(){
 const c=items.find(x=>String(x.id)===String(current))||{title};
 return '<div class="ar-shell"><header class="ar-chathead ar-glass"><button class="ar-icon" id="ar-back" aria-label="Geri">'+g('back')+'</button>'+avatar(c)+'<div class="ar-chathead-title"><strong>'+e(title)+'</strong><small>'+(c.kind==='group'?'Grup':c.kind==='channel'?'Kanal':c.kind==='bot'?'Bot':'Özel sohbet')+'</small></div><button id="ar-more-chat" class="ar-icon" aria-label="Sohbet seçenekleri">'+g('more')+'</button></header><main class="ar-msgscroll" id="ar-msgscroll"><div id="ar-history-pager" class="ar-pager">Mesaj geçmişi yükleniyor…</div><div class="ar-msgstack">'+(messages.length?messages.map(x=>messageBubble(x,c.kind==='group')).join(''):'')+'</div></main>'
 +paletteUI()+toolsUI(c)
 +'<form class="ar-compose-bar ar-glass" id="ar-compose"><input id="ar-draft" type="text" autocomplete="off" autocapitalize="sentences" placeholder="Mesaj yaz…" aria-label="Mesaj yaz"><button type="submit" aria-label="Gönder">'+g('send')+'</button></form></div>';
}
function openChat(id){current=String(id);title=(items.find(x=>String(x.id)===current)||{}).title||'Sohbet';messages=[];historyBusy=true;historyExhausted=false;historyOldest='0';historyTries=0;ttlSelection='0';mediaPalette='';paletteItems=[];render();n.openChat(current);n.history(current);}
function sheet(id){const x=items.find(a=>String(a.id)===String(id));if(!x)return;const fav=favorites.has(String(id)),pin=pins.has(String(id));const overlay=document.createElement('div');overlay.className='ar-overlay';overlay.innerHTML=`<section class="ar-sheet ar-glass"><strong>${e(x.title)}</strong><button data-action="fav">${g('star')}${fav?'Favorilerden çıkar':'Favorilere ekle'}</button><button data-action="pin">${g('pin')}${pin?'Yerel sabitlemeyi kaldır':'Yerel olarak sabitle'}</button><button data-action="open">${g('chat')}Sohbeti aç</button><button data-action="cancel">${g('close')}Vazgeç</button></section>`;overlay.onclick=ev=>{if(ev.target===overlay)overlay.remove();};overlay.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='fav'){if(fav)favorites.delete(String(id));else favorites.add(String(id));saveLocal();}if(a==='pin'){if(pin)pins.delete(String(id));else pins.add(String(id));saveLocal();}overlay.remove();if(a==='open')openChat(id);else render();});root.append(overlay);}
function bindRows(){document.querySelectorAll('.ar-row[data-id]').forEach(el=>{const id=String(el.dataset.id);let press,long=false,x0=0,y0=0;el.onclick=()=>{if(!long)openChat(id);long=false;};el.oncontextmenu=ev=>{ev.preventDefault();sheet(id);return false;};el.onkeydown=ev=>{if(ev.key==='Enter')openChat(id);else if(ev.key===' '){ev.preventDefault();sheet(id);}};el.addEventListener('touchstart',ev=>{long=false;x0=ev.touches[0].clientX;y0=ev.touches[0].clientY;clearTimeout(press);press=setTimeout(()=>{long=true;sheet(id);},550);},{passive:true});el.addEventListener('touchmove',ev=>{if(Math.abs(ev.touches[0].clientY-y0)>13||Math.abs(ev.touches[0].clientX-x0)>13)clearTimeout(press);},{passive:true});el.addEventListener('touchend',ev=>{clearTimeout(press);const dx=ev.changedTouches[0].clientX-x0,dy=ev.changedTouches[0].clientY-y0;if(!long&&Math.abs(dx)>78&&Math.abs(dx)>Math.abs(dy)*1.8){long=true;if(dx>0){favorites.has(id)?favorites.delete(id):favorites.add(id);}else{pins.has(id)?pins.delete(id):pins.add(id);}saveLocal();render();}if(long)setTimeout(()=>{long=false;},300);},{passive:true});el.addEventListener('touchcancel',()=>clearTimeout(press),{passive:true});});}
function render(){if(stage!=='ready'){login();return;}const cs=document.getElementById('ar-folders'),pos=cs?cs.scrollLeft:0,old=document.getElementById('ar-list'),y=old?old.scrollTop:0;root.innerHTML=current?conversation():list();const newCats=document.getElementById('ar-folders'),newList=document.getElementById('ar-list');if(newCats)newCats.scrollLeft=pos;if(newList)newList.scrollTop=y;bindApp();}

function refreshChatRows(){
 if(stage!=='ready'||current)return;
 const list=document.getElementById('ar-list');
 if(list){list.innerHTML=tab==='people'
  ?items.filter(x=>x.kind==='private'&&(x.title||'').toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr'))).map(row).join('')||empty()
  :chatList();bindRows();}
 document.querySelectorAll('[data-folder]').forEach(el=>{
   const count=countFolder(el.dataset.folder);
   let badge=el.querySelector('.ar-count');
   if(count){
      if(!badge){badge=document.createElement('span');badge.className='ar-count';el.appendChild(badge);}
      badge.textContent=count>999?'999+':String(count);
   }else if(badge)badge.remove();
 });
 document.querySelectorAll('[data-quick]').forEach(el=>{
  if(el.dataset.quick==='unread'){
   const unread=items.filter(x=>inFolder(x,folder)&&(Number(x.unread||0)>0||x.markedUnread)).length;
   el.textContent='Okunmamış'+(unread?' · '+unread:'');
  }
 });
 const counts=document.querySelector('.ar-section span:last-child');
 if(counts&&tab==='chats')counts.textContent=filtered().length+' sohbet';
}
function scrollMessagesToBottom(){
 const ms=document.getElementById('ar-msgscroll');if(ms)ms.scrollTop=ms.scrollHeight;
}
function insertHistory(itemsNew,older){
 if(!Array.isArray(itemsNew))itemsNew=[];
 const unique=itemsNew.filter(m=>!messages.some(v=>String(v.id)===String(m.id)));
 const ms=document.getElementById('ar-msgscroll'),stack=document.querySelector('.ar-msgstack');
 const wasBottom=ms&&ms.scrollHeight-ms.scrollTop-ms.clientHeight<130;
 const oldHeight=ms?ms.scrollHeight:0;
 if(older)messages=[...unique,...messages];else messages=unique;
 if(stack){
  const chat=items.find(x=>String(x.id)===String(current));
  const html=unique.map(x=>messageBubble(x,chat&&chat.kind==='group')).join('');
  if(older)stack.insertAdjacentHTML('afterbegin',html);
  else stack.innerHTML=messages.map(x=>messageBubble(x,chat&&chat.kind==='group')).join('');
  if(ms){
   if(older)ms.scrollTop=Math.max(0,ms.scrollHeight-oldHeight);
   else if(wasBottom || !older)ms.scrollTop=ms.scrollHeight;
  }
 }
}
function bindApp(){
 const changeTheme=()=>{dark=!dark;localStorage.setItem('arm-dark',dark?'1':'0');document.body.classList.toggle('dark',dark);n.theme(dark);render();};
 for(const id of ['ar-theme','ar-theme-toggle']){const b=document.getElementById(id);if(b)b.onclick=changeTheme;}
 const opt=document.getElementById('ar-options');if(opt)opt.onclick=()=>{tab='settings';render();};
 const range=document.getElementById('ar-blur');if(range)range.oninput=()=>{blur=Number(range.value);localStorage.setItem('ar-blur',String(blur));document.documentElement.style.setProperty('--ar-blur',blur+'px');};
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;q='';current=null;render();});
 document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folder=b.dataset.folder;localStorage.setItem('ar-folder',folder);quick='all';q='';render();const a=document.querySelector('.ar-folder.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});});
 document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{quick=b.dataset.quick;render();});
 const sort=document.getElementById('ar-sort');if(sort)sort.onclick=()=>{descending=!descending;render();};
 const search=document.getElementById('ar-search');if(search)search.oninput=ev=>{q=ev.target.value;refreshChatRows();};
 bindRows();
 const b=document.getElementById('ar-back');if(b)b.onclick=()=>{n.closeChat(current);current=null;messages=[];render();n.chats();};
 const c=document.getElementById('ar-compose');if(c)c.onsubmit=ev=>{
    ev.preventDefault();const input=document.getElementById('ar-draft');
    if(input&&input.value.trim()){n.send(current,input.value.trim());input.value='';}
 };
 const m=document.getElementById('ar-more-chat');if(m)m.onclick=()=>sheet(current);
 const ms=document.getElementById('ar-msgscroll');
 if(ms) {
    ms.scrollTop=ms.scrollHeight;
    ms.onscroll=()=>{
      if(ms.scrollTop<140&&!historyBusy&&!historyExhausted&&historyOldest!=='0'){
        historyBusy=true;n.historyOlder(current,historyOldest);
      }
    };
 }
 const logout=document.getElementById('logout');if(logout)logout.onclick=()=>{if(confirm('Telegram hesabından çıkış yapılsın mı?'))n.logout();};
 const ttl=document.getElementById('ar-ttl');if(ttl)ttl.onchange=()=>{ttlSelection=ttl.value;};
 document.querySelectorAll('[data-ar-media]').forEach(btn=>btn.onclick=()=>{n.pickMedia(current,btn.dataset.arMedia,Number(ttlSelection));});
 document.querySelectorAll('[data-ar-palette]').forEach(btn=>btn.onclick=()=>{
   const next=btn.dataset.arPalette;
   mediaPalette=mediaPalette===next?'':next;
   paletteItems=[];
   togglePalette();
   if(mediaPalette==='gif'||mediaPalette==='sticker')n.mediaPalette(mediaPalette);
 });
 bindPalette();
}
function togglePalette(){
 const shell=document.querySelector('.ar-shell');
 if(!shell)return;
 const existing=document.getElementById('ar-media-palette');if(existing)existing.remove();
 const bar=document.getElementById('ar-tools');if(!bar)return;
 if(mediaPalette)bar.insertAdjacentHTML('beforebegin',paletteUI());
 bindPalette();
}
function bindPalette(){
 document.querySelectorAll('[data-ar-emoji]').forEach(btn=>btn.onclick=()=>{
    const input=document.getElementById('ar-draft');if(!input)return;
    const symbol=EMOJI_SET[Number(btn.dataset.arEmoji)];
    const at=input.selectionStart;
    input.value=input.value.slice(0,at)+symbol+input.value.slice(input.selectionEnd);
    input.focus();input.setSelectionRange(at+symbol.length,at+symbol.length);
 });
 document.querySelectorAll('[data-ar-saved]').forEach(btn=>btn.onclick=()=>{
   n.sendSavedMedia(current,mediaPalette,Number(btn.dataset.arSaved));
 });
 const fromFile=document.getElementById('ar-palette-file');
 if(fromFile)fromFile.onclick=()=>n.pickMedia(current,mediaPalette,0);
}

window.onTdEvent=function(v){
 if(v.type==='auth'){
   const changed=stage!==v.value;
   stage=v.value;
   if(changed)authSubmitting=false;
   if(stage!=='ready'){current=null;tab='chats';}
   if(changed||!document.getElementById('login'))render();
   if(stage==='phone')n.countries();
 }
 else if(v.type==='error'){
   notify('Telegram: '+v.value);historyBusy=false;
   if(stage!=='ready'){authSubmitting=false;const b=document.getElementById('arman-login-submit');if(b)b.disabled=false;
     const m=document.getElementById('ar-auth-feedback');if(m)m.textContent=v.value||'Giriş hatası';}
 }
 else if(v.type==='countries'){worldCountries=v.items||[];refreshCountryOptions();}
 else if(v.type==='authPending'){
   const m=document.getElementById('ar-auth-feedback');if(m)m.textContent=v.value||'Telegram yanıtı bekleniyor…';
 }
 else if(v.type==='authFailed'){
   authSubmitting=false;
   const b=document.getElementById('arman-login-submit');if(b)b.disabled=false;
 }
 else if(v.type==='status'){if(stage==='otherdevice')notify(v.value);}
 else if(v.type==='mediaSent'){notify('Medya gönderiliyor…');}
 else if(v.type==='me'){name=v.value;if(stage==='ready'&&!current&&tab==='profile')render();}
 else if(v.type==='chats'){
   items=v.items||[];
   // Never replace the search input or its focus on incoming Telegram updates.
   if(stage==='ready'&&!current&&tab!=='settings'&&tab!=='profile')refreshChatRows();
 }
 else if((v.type==='history'||v.type==='historyOlder')&&String(v.chat)===String(current)){
   historyBusy=false;
   if(v.type==='history'&&!v.items?.length&&historyTries<2){
      historyTries++;
      setTimeout(()=>{if(current===String(v.chat)){historyBusy=true;n.history(current);}},900);
      return;
   }
   historyOldest=String(v.oldest||historyOldest);
   historyExhausted=!v.hasMore || (v.type==='historyOlder'&&!v.items?.length);
   const pager=document.getElementById('ar-history-pager');
   if(pager)pager.textContent=historyExhausted?'Mesaj geçmişinin başlangıcı':'Daha eski mesajlar için yukarı kaydır';
   insertHistory(v.items||[],v.type==='historyOlder');
 }
 else if(v.type==='palette'){
   if(v.kind===mediaPalette){paletteItems=v.items||[];togglePalette();}
 }
 else if(v.type==='avatar'){
   avatarCache[String(v.chat)]=v.data;
   document.querySelectorAll('[data-avatar-id]').forEach(a=>{if(a.dataset.avatarId===String(v.chat)){const img=document.createElement('img');img.alt='';img.src=v.data;a.replaceChildren(img);}});
 }
 else if(v.type==='sender'){
   const key=String(v.key||''),value=String(v.name||'Katılımcı');senderNames[key]=value;
   document.querySelectorAll('[data-sender-name]').forEach(el=>{if(el.dataset.senderName===key)el.textContent=value;});
   document.querySelectorAll('[data-sender-avatar]').forEach(el=>{if(el.dataset.senderAvatar===key&&!senderAvatars[key])el.textContent=value.trim().slice(0,1).toLocaleUpperCase('tr-TR');});
 }
 else if(v.type==='senderAvatar'){
   const key=String(v.key||'');senderAvatars[key]=v.data;
   document.querySelectorAll('[data-sender-avatar]').forEach(el=>{if(el.dataset.senderAvatar===key){const img=document.createElement('img');img.src=v.data;img.alt='';el.replaceChildren(img);}});
 }
 else if(v.type==='message'&&String(v.chat)===String(current)){
   if(!messages.some(x=>x.id===v.id)){
     messages.push(v);
     const stack=document.querySelector('.ar-msgstack'),viewport=document.getElementById('ar-msgscroll');
     if(stack&&viewport){
       const nearBottom=viewport.scrollHeight-viewport.scrollTop-viewport.clientHeight<180;
       const chat=items.find(x=>String(x.id)===String(current));
       stack.insertAdjacentHTML('beforeend',messageBubble(v,chat&&chat.kind==='group'));
       if(nearBottom)viewport.scrollTop=viewport.scrollHeight;
     }
   }
 }
};
window.armanBack=function(){const overlay=document.querySelector('.ar-overlay');if(overlay){overlay.remove();return true;}if(current){n.closeChat(current);current=null;messages=[];render();return true;}if(stage==='ready'&&tab!=='chats'){tab='chats';render();return true;}if(stage==='ready'&&folder!=='private'){folder='private';render();return true;}return false;};
n.theme(dark);render();n.ready();

})();
</script></body></html>
